openapi: 3.1.0
info:
  title: BZUP Link 짧은 주소 API
  version: 2.0.0
  description: |
    강의 UUID·유형(type_key)·목적지 주소·명칭으로 짧은 주소를 발급합니다.

    - 모든 요청에 `Authorization: Bearer <API 키>` 가 필요합니다. 키는 서버에만 보관하세요.
    - 유형 목록의 기준은 서버 데이터입니다. `type_key` 는 고정 enum 이 아니며,
      `GET /api/v1/short-link-types` 로 조회한 등록 유형만 허용됩니다.
    - 숫자 `type` 방식(0000~9999)은 폐기되었습니다. `type` 필드를 보내면 422 `VALIDATION_ERROR` 입니다.
    - 같은 강의에는 유형별로 짧은 주소가 하나만 존재합니다.
servers:
  - url: https://bizup.im
security:
  - bearerAuth: []
paths:
  /api/v1/short-link-types:
    get:
      summary: 유형 목록 조회
      description: 활성·비활성 유형을 모두 반환하며 key 오름차순입니다. 짧은 주소 생성용 API 키로 조회할 수 있습니다.
      operationId: listShortLinkTypes
      responses:
        '200':
          description: 유형 목록
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items: { $ref: '#/components/schemas/ShortLinkType' }
              example:
                types:
                  - { key: landing, label: 기본 랜딩 QR, active: true }
                  - { key: payment, label: 결제페이지 QR, active: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/short-links:
    post:
      summary: 짧은 주소 발급
      description: |
        처리 순서: 인증·권한 → 입력 형식 → 강의 확인 → 같은 강의·유형 링크가 있으면 409 (유형이 비활성이어도)
        → 미등록 유형 422 `UNKNOWN_LINK_TYPE` → 비활성 유형 422 `LINK_TYPE_INACTIVE` → 생성(201).

        기존 링크가 있으면 새로 만들거나 이름·연결 주소를 덮어쓰지 않고 409 와 함께 기존 주소를 반환합니다.
        같은 목적지 주소가 다른 링크에 있어도 확인 없이 발급합니다.
        접근할 수 없거나 없는 강의는 구분하지 않고 422 `COURSE_REQUIRED` 로 응답합니다.
      operationId: createShortLink
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            요청마다 새 UUID. 같은 키·같은 본문 재시도는 원래 응답(201)을 그대로 돌려주고 링크를 추가로 만들지 않습니다.
            같은 키를 다른 본문에 쓰면 409 `IDEMPOTENCY_KEY_REUSED`. 키를 생략하면 같은 강의·유형 재요청은 409 `LINK_TYPE_EXISTS`.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [course_id, type_key, destination_url, name]
              properties:
                course_id: { type: string, format: uuid, description: 강의 UUID (진행중 강의만) }
                type_key:
                  type: string
                  pattern: '^[a-z][a-z0-9_]{0,63}$'
                  description: 등록된 유형 key. 목록은 GET /api/v1/short-link-types 로 조회합니다 (고정 enum 아님).
                  examples: [landing, payment]
                destination_url: { type: string, maxLength: 2000, description: 'http/https 전체 URL, 사용자명·비밀번호 포함 금지' }
                name: { type: string, minLength: 1, maxLength: 120, description: 앞뒤 공백 제거 후 1~120자 }
            example:
              course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
              type_key: payment
              destination_url: https://example.com/payment
              name: AI 수익화 클래스 결제페이지
      responses:
        '201':
          description: 새 짧은 주소 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 같은 강의·유형의 링크가 이미 있음(LINK_TYPE_EXISTS, details 에 기존 주소) 또는 Idempotency-Key 재사용(IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: LINK_TYPE_EXISTS
                  message: 이 강의에는 같은 유형의 짧은 주소가 이미 있습니다.
                  details:
                    course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
                    type_key: payment
                    type_label: 결제페이지 QR
                    link_id: 76cb8534-125a-45f9-9081-e37e6b4805f4
                    short_code: Ab3dE7x
                    short_url: https://bizup.im/Ab3dE7x
                  request_id: '…'
        '422':
          description: |
            COURSE_REQUIRED(강의 누락·없음), COURSE_NOT_ACTIVE(종료 강의), UNKNOWN_LINK_TYPE(미등록 type_key),
            LINK_TYPE_INACTIVE(비활성 유형 신규 발급), VALIDATION_ERROR(구형 type 필드, type_key 누락·형식, URL·이름 오류, 알 수 없는 필드)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/courses:
    get:
      summary: 강의 목록 (강의 UUID 조회)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, closed] } }
      responses:
        '200': { description: 강의 목록 (`data` 배열 — id, name, instructor_name, cohort, webinar_at, status) }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: BZUP Link 시스템 API 키 }
  schemas:
    ShortLinkType:
      type: object
      required: [key, label, active]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string }
        active: { type: boolean }
    ShortLink:
      type: object
      required: [short_url, short_code, link_id, course_id, type_key, type_label, name, destination_url, created_at]
      properties:
        short_url: { type: string, example: https://bizup.im/Ab3dE7x }
        short_code: { type: string, example: Ab3dE7x }
        link_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        type_key: { type: string, example: payment }
        type_label: { type: string, example: 결제페이지 QR }
        name: { type: string }
        destination_url: { type: string }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
  responses:
    Unauthorized:
      description: INVALID_API_KEY — 키 누락·오류·만료·폐기
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: INSUFFICIENT_SCOPE — 키 권한 부족
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: RATE_LIMITED — 요청 제한 초과 (Retry-After 헤더)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
