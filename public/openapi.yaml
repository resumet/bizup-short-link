openapi: 3.1.0
info:
  title: BZUP Link 짧은 주소 API
  version: 2.1.0
  description: |
    강의 UUID·유형(type_key)·목적지 주소·명칭으로 짧은 주소를 발급합니다.

    - 모든 요청에 `Authorization: Bearer <API 키>` 가 필요합니다. 키는 서버에만 보관하세요.
    - 유형 목록의 기준은 서버 데이터입니다. `type_key` 는 고정 enum 이 아니며,
      `GET /api/v1/short-link-types` 로 조회한 등록 유형만 허용됩니다.
    - 숫자 `type` 방식(0000~9999)은 폐기되었습니다. `type` 필드를 보내면 422 `VALIDATION_ERROR` 입니다.
    - 같은 강의에는 유형별로 짧은 주소가 하나만 존재합니다.

    **전환형 유형** (`slots` 가 있는 유형, 예: `free_chat` 무료단톡방 = chat 단톡방 / youtube 유튜브 라이브 / zoom 줌 라이브)
    - 짧은 주소 하나에 전환 주소 2~5개를 둡니다. 만들 때는 첫 주소만 필수이고 나머지는 비워 둡니다.
    - 주소가 나오면 `PUT /api/v1/short-links/slots` 로 채우고, `POST /api/v1/short-links/switch` 로 연결 대상을 바꿉니다.
      전환은 다음 클릭부터 바로 적용됩니다 (짧은 주소 응답은 캐시하지 않음).
    - 강의 UUID + type_key 로 링크를 찾으므로 링크 ID·ETag 가 필요 없습니다. 같은 요청을 반복해도 안전합니다
      (이미 그 상태면 `changed_fields: []`).
    - 지금 연결 중인 주소는 항상 채워져 있습니다: 빈 주소로 전환하거나 연결 중인 주소를 비우면 409 `SLOT_EMPTY`.
servers:
  - url: https://bizup.im
security:
  - bearerAuth: []
paths:
  /api/v1/short-link-types:
    get:
      summary: 유형 목록 조회
      description: |
        활성·비활성 유형을 모두 반환하며 key 오름차순입니다. 짧은 주소 생성용 API 키로 조회할 수 있습니다.
        `slots` 는 전환형 유형의 전환 주소 구성이고, 일반 유형은 null 입니다.
      operationId: listShortLinkTypes
      responses:
        '200':
          description: 유형 목록
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items: { $ref: '#/components/schemas/ShortLinkType' }
              example:
                types:
                  - key: free_chat
                    label: 무료단톡방
                    active: true
                    slots:
                      - { key: chat, label: 단톡방 }
                      - { key: youtube, label: 유튜브 라이브 }
                      - { key: zoom, label: 줌 라이브 }
                  - { key: landing, label: 기본 랜딩 QR, active: true, slots: null }
                  - { key: payment, label: 결제페이지 QR, active: true, slots: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/short-links:
    get:
      summary: 강의·유형의 짧은 주소와 전환 상태 조회
      description: 권한 `links:read`. 그 강의에 해당 유형의 짧은 주소가 없으면 404 `NOT_FOUND`.
      operationId: getShortLinkState
      parameters:
        - { name: course_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: type_key, in: query, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' } }
      responses:
        '200':
          description: 현재 상태
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ShortLinkState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 이 강의에 해당 유형의 짧은 주소가 없음 (NOT_FOUND) }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      summary: 짧은 주소 발급
      description: |
        처리 순서: 인증·권한 → 입력 형식 → 강의 확인 → 같은 강의·유형 링크가 있으면 409 (유형이 비활성이어도)
        → 미등록 유형 422 `UNKNOWN_LINK_TYPE` → 비활성 유형 422 `LINK_TYPE_INACTIVE` → 생성(201).

        기존 링크가 있으면 새로 만들거나 이름·연결 주소를 덮어쓰지 않고 409 와 함께 기존 주소를 반환합니다.
        같은 목적지 주소가 다른 링크에 있어도 확인 없이 발급합니다.
        접근할 수 없거나 없는 강의는 구분하지 않고 422 `COURSE_REQUIRED` 로 응답합니다.

        전환형 유형은 `slot_urls` 로 전환 주소를 보냅니다. 첫 주소만 필수이고(또는 `destination_url` 로 대신),
        나머지는 null 이거나 생략해 비워 둡니다. 처음에는 첫 주소로 연결됩니다.
      operationId: createShortLink
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            요청마다 새 UUID. 같은 키·같은 본문 재시도는 원래 응답(201)을 그대로 돌려주고 링크를 추가로 만들지 않습니다.
            같은 키를 다른 본문에 쓰면 409 `IDEMPOTENCY_KEY_REUSED`. 키를 생략하면 같은 강의·유형 재요청은 409 `LINK_TYPE_EXISTS`.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [course_id, type_key, name]
              properties:
                course_id: { type: string, format: uuid, description: 강의 UUID (진행중 강의만) }
                type_key:
                  type: string
                  pattern: '^[a-z][a-z0-9_]{0,63}$'
                  description: 등록된 유형 key. 목록은 GET /api/v1/short-link-types 로 조회합니다 (고정 enum 아님).
                  examples: [landing, payment, free_chat]
                destination_url:
                  type: string
                  maxLength: 2000
                  description: 'http/https 전체 URL, 사용자명·비밀번호 포함 금지. 일반 유형은 필수, 전환형은 첫 주소로 쓰임 (slot_urls 로 대신 가능)'
                name: { type: string, minLength: 1, maxLength: 120, description: 앞뒤 공백 제거 후 1~120자 }
                slot_urls:
                  type: object
                  description: '전환형 유형만. { 전환키: URL | null }. 첫 키는 필수(또는 destination_url), 나머지는 null·생략 가능'
                  additionalProperties: { type: [string, 'null'] }
            examples:
              일반 유형:
                value:
                  course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
                  type_key: payment
                  destination_url: https://example.com/payment
                  name: AI 수익화 클래스 결제페이지
              전환형 유형 (유튜브·줌은 나중에):
                value:
                  course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
                  type_key: free_chat
                  name: AI 수익화 클래스 무료단톡방
                  slot_urls: { chat: 'https://open.kakao.com/o/abc123', youtube: null, zoom: null }
      responses:
        '201':
          description: 새 짧은 주소 발급 (전환형은 active_slot·slots 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 같은 강의·유형의 링크가 이미 있음(LINK_TYPE_EXISTS, details 에 기존 주소) 또는 Idempotency-Key 재사용(IDEMPOTENCY_KEY_REUSED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: LINK_TYPE_EXISTS
                  message: 이 강의에는 같은 유형의 짧은 주소가 이미 있습니다.
                  details:
                    course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
                    type_key: payment
                    type_label: 결제페이지 QR
                    link_id: 76cb8534-125a-45f9-9081-e37e6b4805f4
                    short_code: Ab3dE7x
                    short_url: https://bizup.im/Ab3dE7x
                  request_id: '…'
        '422':
          description: |
            COURSE_REQUIRED(강의 누락·없음), COURSE_NOT_ACTIVE(종료 강의), UNKNOWN_LINK_TYPE(미등록 type_key),
            LINK_TYPE_INACTIVE(비활성 유형 신규 발급), VALIDATION_ERROR(구형 type 필드, type_key 누락·형식, URL·이름 오류,
            알 수 없는 필드, 전환형 첫 주소 누락, 유형에 없는 전환 키, 일반 유형에 slot_urls)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/short-links/slots:
    put:
      summary: 전환 주소 채우기·바꾸기·비우기
      description: |
        권한 `links:update`. 지정한 전환 주소 하나를 채우거나 바꿉니다. `destination_url: null` 이면 비웁니다.
        `activate: true` 면 채운 뒤 바로 그 주소로 전환합니다 (라이브 시작 때 한 번에).
        지금 연결 중인 주소를 바꾸면 다음 클릭부터 바로 새 주소로 이동합니다. 연결 중인 주소는 비울 수 없습니다 (409 SLOT_EMPTY).
      operationId: setShortLinkSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [course_id, type_key, slot, destination_url]
              properties:
                course_id: { type: string, format: uuid }
                type_key: { type: string, example: free_chat }
                slot: { type: string, description: 전환 키, example: youtube }
                destination_url: { type: [string, 'null'], maxLength: 2000 }
                activate: { type: boolean, default: false }
            example:
              course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
              type_key: free_chat
              slot: youtube
              destination_url: https://www.youtube.com/live/abc
              activate: false
      responses:
        '200':
          description: 변경 후 상태 (changed_fields 가 비어 있으면 이미 그 상태)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ShortLinkState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 이 강의에 해당 유형의 짧은 주소가 없음 (NOT_FOUND) }
        '409': { description: 'SLOT_EMPTY — 연결 중인 주소를 비우려 함, 또는 비우면서 activate=true' }
        '422': { description: 'UNKNOWN_SLOT(없는 전환 키), LINK_NOT_SWITCHABLE(전환형 아님), VALIDATION_ERROR·INVALID_DESTINATION_URL(주소 오류)' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/short-links/switch:
    post:
      summary: 전환
      description: |
        권한 `links:update`. 짧은 주소의 연결 대상을 지정한 전환 주소로 바꿉니다. 다음 클릭부터 바로 적용됩니다.
        비어 있는 주소로는 전환할 수 없습니다 (409 SLOT_EMPTY). 이미 그 주소로 연결 중이면 변경 없이 200.
      operationId: switchShortLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [course_id, type_key, slot]
              properties:
                course_id: { type: string, format: uuid }
                type_key: { type: string, example: free_chat }
                slot: { type: string, description: 전환 키, example: youtube }
            example:
              course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
              type_key: free_chat
              slot: youtube
      responses:
        '200':
          description: 전환 후 상태
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ShortLinkState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 이 강의에 해당 유형의 짧은 주소가 없음 (NOT_FOUND) }
        '409': { description: SLOT_EMPTY — 비어 있는 주소 }
        '422': { description: 'UNKNOWN_SLOT(없는 전환 키), LINK_NOT_SWITCHABLE(전환형 아님)' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/courses:
    get:
      summary: 강의 목록 (강의 UUID 조회)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, closed] } }
      responses:
        '200': { description: 강의 목록 (`data` 배열 — id, name, instructor_name, cohort, webinar_at, status) }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: BZUP Link 시스템 API 키 }
  schemas:
    ShortLinkType:
      type: object
      required: [key, label, active, slots]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        label: { type: string }
        active: { type: boolean }
        slots:
          type: [array, 'null']
          description: 전환형 유형의 전환 주소 구성 (2~5개, 첫 번째가 기본). 일반 유형은 null
          items: { $ref: '#/components/schemas/SlotDef' }
    SlotDef:
      type: object
      required: [key, label]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', example: youtube }
        label: { type: string, example: 유튜브 라이브 }
    Slot:
      type: object
      required: [key, label, destination_url]
      properties:
        key: { type: string, example: youtube }
        label: { type: string, example: 유튜브 라이브 }
        destination_url: { type: [string, 'null'], description: 비어 있으면 null }
    ShortLink:
      type: object
      required: [short_url, short_code, link_id, course_id, type_key, type_label, name, destination_url, created_at]
      properties:
        short_url: { type: string, example: https://bizup.im/Ab3dE7x }
        short_code: { type: string, example: Ab3dE7x }
        link_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        type_key: { type: string, example: payment }
        type_label: { type: string, example: 결제페이지 QR }
        name: { type: string }
        destination_url: { type: string, description: 지금 연결된 주소 }
        active_slot: { type: string, description: 전환형만. 지금 연결된 전환 키, example: chat }
        slots: { type: array, description: 전환형만, items: { $ref: '#/components/schemas/Slot' } }
        created_at: { type: string, format: date-time }
    ShortLinkState:
      type: object
      required: [link_id, short_url, short_code, course_id, type_key, name, status, destination_url, switchable, active_slot, slots]
      properties:
        link_id: { type: string, format: uuid }
        short_url: { type: string, example: https://bizup.im/Ab3dE7x }
        short_code: { type: string }
        course_id: { type: string, format: uuid }
        type_key: { type: string, example: free_chat }
        type_label: { type: [string, 'null'], example: 무료단톡방 }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
        destination_url: { type: string, description: 지금 연결된 주소 (짧은 주소를 누르면 가는 곳) }
        switchable: { type: boolean, description: 전환형 유형으로 만든 링크인지 }
        active_slot: { type: [string, 'null'], example: youtube }
        active_slot_label: { type: [string, 'null'], example: 유튜브 라이브 }
        slots: { type: [array, 'null'], items: { $ref: '#/components/schemas/Slot' } }
        updated_at: { type: string, format: date-time }
        changed_fields: { type: array, items: { type: string }, description: '변경 요청 응답에만. 비어 있으면 이미 그 상태' }
      example:
        link_id: 76cb8534-125a-45f9-9081-e37e6b4805f4
        short_url: https://bizup.im/Ab3dE7x
        short_code: Ab3dE7x
        course_id: 3f6c8c23-9e12-4c75-a4d2-6425ddcd2101
        type_key: free_chat
        type_label: 무료단톡방
        name: AI 수익화 클래스 무료단톡방
        status: active
        destination_url: https://www.youtube.com/live/abc
        switchable: true
        active_slot: youtube
        active_slot_label: 유튜브 라이브
        slots:
          - { key: chat, label: 단톡방, destination_url: 'https://open.kakao.com/o/abc123' }
          - { key: youtube, label: 유튜브 라이브, destination_url: 'https://www.youtube.com/live/abc' }
          - { key: zoom, label: 줌 라이브, destination_url: null }
        updated_at: '2026-11-27T11:00:00Z'
        changed_fields: [active_slot, destination_url]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
  responses:
    Unauthorized:
      description: INVALID_API_KEY — 키 누락·오류·만료·폐기
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: INSUFFICIENT_SCOPE — 키 권한 부족
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: RATE_LIMITED — 요청 제한 초과 (Retry-After 헤더)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
